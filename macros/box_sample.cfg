# ====================================================================================
# Exemplo de Integracao no box.cfg da Creality K1 com CFS
# ====================================================================================

[box]
# ... suas configuracoes existentes ...
cut_pos_x: 42.0
cut_pos_y: 224.7

# AJUSTE CRITICO: Aumentado de 1.3 para 1.8 (+0.5mm)
# Garante o acionamento firme do microswitch PA8 com a mola nova mais rigida da extrusora,
# eliminando o looping infinito de repeticao de corte!
cut_pos_offset: 1.8

# ...

[gcode_macro BOX_LOAD_MATERIAL_WITH_MATERIAL]
gcode:
  M104
  IF_NEED_HOME
  BOX_ERROR_CLEAR
  BOX_CHECK_MATERIAL
  BOX_CUT_MATERIAL
  BOX_RETRUDE_MATERIAL
  BOX_GO_TO_EXTRUDE_POS
  BOX_EXTRUDE_MATERIAL
  BOX_EXTRUDER_EXTRUDE
  ; ----------------------------------------------------
  ; LIMPEZA CALIBRADA NA ESCOVA DO CFS APOS A PURGA
  ; ----------------------------------------------------
  CFS_SAFE_WIPE
  ; ----------------------------------------------------
  RESTORE_POSITION

[gcode_macro BOX_LOAD_MATERIAL_WITHOUT_MATERIAL]
gcode:
  M104
  BOX_CHECK_MATERIAL
  BOX_EXTRUDE_MATERIAL
  BOX_EXTRUDER_EXTRUDE
  ; ----------------------------------------------------
  ; LIMPEZA CALIBRADA NA CARGA INICIAL
  ; ----------------------------------------------------
  CFS_SAFE_WIPE
  ; ----------------------------------------------------
