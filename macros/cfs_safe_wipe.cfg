# ====================================================================================
# CFS_SAFE_WIPE - Macro de Limpeza de Bico com Escova de Silicone para Creality K1 / CFS
# Desenvolvido e calibrado por: Ivan Marcos (Demolidor31br)
# Repositorio: https://github.com/Demolidor31br/creality-k1-cfs-nozzle-wiper
# ====================================================================================

[gcode_macro CFS_SAFE_WIPE]
description: Limpeza profunda nos pinos de silicone do CFS com salvaguarda suave de eixo Z e despressurizacao anti-gotejamento
gcode:
  G90
  M400
  
  ; 1. Salva a altura Z real da peca sendo impressa
  {% set orig_z = printer.toolhead.position.z|float %}

  ; 2. Retracao rapida de 1.0mm anti-gotejamento (alivia a pressao interna do bico antes de esfregar)
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E-1.0 F1800
    G90
    M400
  {% endif %}

  ; 3. RESTAURA A TEMPERATURA DE IMPRESSAO (sai imediatamente dos 250C da purga nativa do CFS)
  {% set target_temp = params.TARGET_TEMP|default(232.0)|float %}
  {% if target_temp > 150.0 %}
    M104 S{target_temp}
    {action_respond_info("--> Temperatura do bico restaurada para impressao: %0.1f C (saindo dos 250C da purga)" % target_temp)}
  {% endif %}

  ; 4. Avanca a cabeca para frente em Y215 (zona segura e aberta)
  G1 Y215 F6000
  M400

  ; 5. SALVAGUARDA TOTAL DE Z (Suave a 10 mm/s = F600):
  ; Se a mesa estiver levantada (Z < 30mm), abaixa suavemente para Z=30mm para livrar a rampa mecanica da escova
  {% if orig_z < 30.0 %}
    G1 Z30 F600
    M400
  {% endif %}

  ; 6. Centraliza no eixo X sobre os pinos de silicone (X168)
  G1 X168 F6000
  M400

  ; 7. Engate traseiro nos pinos (Y226.3 empurra a rampa mecanica e eleva a escova de encontro a ponta do bico)
  G1 Y226.3 F3000
  M400

  ; 8. Escovacao Ativa: 6 ciclos completos (12 passadas ampliadas de 6mm a 60 mm/s)
  G1 X165.0 F3600
  G1 X171.0 F3600
  G1 X165.0 F3600
  G1 X171.0 F3600
  G1 X165.0 F3600
  G1 X171.0 F3600
  G1 X165.0 F3600
  G1 X171.0 F3600
  G1 X165.0 F3600
  G1 X171.0 F3600
  G1 X165.0 F3600
  G1 X171.0 F3600
  G1 X168.0 F3600
  M400

  ; 9. Desengata para a frente para a zona de seguranca (Y215)
  G1 Y215 F6000
  M400

  ; 10. Restaura a mesa para a altura Z exata da camada suavemente (F600 = 10 mm/s) antes de viajar para a peca/torre
  {% if orig_z < 30.0 %}
    G1 Z{orig_z} F600
    M400
  {% endif %}


[gcode_macro TESTE_LIMPEZA_BICO]
description: Teste visual a seco do movimento de limpeza na escovinha do CFS (com mesa rebaixada em Z60 e 6 ciclos)
gcode:
  ; 1. Garante o Home dos eixos caso necessario
  IF_NEED_HOME
  G90
  
  ; 2. SEGURANCA OBRIGATORIA: Abaixa a mesa para Z=60mm para livrar a calha com folga total suavemente (F600)
  {action_respond_info("--> Abaixando a mesa para Z=60mm por seguranca suave...")}
  {% if printer.toolhead.position.z < 60 %}
    G1 Z60 F600
  {% endif %}
  M400

  ; 3. Posiciona no duto da purga (simulando fim da purga)
  {action_respond_info("--> Simulando fim da purga no duto traseiro (X148 Y226.5)...")}
  G1 X148 Y226.5 F4000
  G4 P1000 ; Pausa de 1s para inspecao visual

  ; 4. Executa a rotina oficial de limpeza calibrada
  CFS_SAFE_WIPE

  ; 5. Retorna para o centro da mesa
  G1 X110 Y110 F6000
  {action_respond_info("--> Teste de limpeza finalizado com 100% de sucesso!")}
