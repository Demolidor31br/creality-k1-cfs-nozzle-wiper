# ====================================================================================
# CFS_SAFE_WIPE - Macro de Limpeza de Bico com Escova de Silicone para Creality K1 / CFS
# Versao: 2.0 (Retracao 2mm anti-gotejamento, 36 passadas e saida lateral direita)
# Desenvolvido e calibrado por: Ivan Marcos (Demolidor31br)
# Repositorio: https://github.com/Demolidor31br/creality-k1-cfs-nozzle-wiper
# ====================================================================================

[gcode_macro CFS_SAFE_WIPE]
description: Limpeza profunda nos pinos de silicone do CFS (v2: retracao 2mm, 36 passadas e saida lateral direita)
gcode:
  G90
  M400
  
  ; 1. Salva a altura Z real da peca sendo impressa
  {% set orig_z = printer.toolhead.position.z|float %}

  ; 2. Retracao rapida de 2.0mm anti-gotejamento (alivia a pressao interna do bico antes de esfregar)
  {% if printer.extruder.can_extrude|lower == 'true' %}
    G91
    G1 E-2.0 F1800
    G90
    M400
  {% endif %}

  ; 3. RESTAURA A TEMPERATURA DE IMPRESSAO (sai imediatamente dos 250C da purga do CFS)
  {% set target_temp = params.TARGET_TEMP|default(232.0)|float %}
  {% if target_temp > 150.0 %}
    M104 S{target_temp}
    {action_respond_info("--> Temperatura do bico restaurada para impressao: %0.1f C (saindo dos 250C da purga)" % target_temp)}
  {% endif %}

  ; 4. Garante que a cabeca vem para a frente em Y215 (campo aberto e seguro)
  G1 Y215 F6000
  M400

  ; 5. SALVAGUARDA TOTAL DE Z (Suave a 10 mm/s = F600):
  ; Se a mesa estiver levantada (Z < 30mm), abaixa para Z=30mm antes de ir para a escova!
  {% if orig_z < 30.0 %}
    G1 Z30 F600
    M400
  {% endif %}

  ; 6. Desloca para X168 (alinhado no centro dos pinos de silicone)
  G1 X168 F6000
  M400

  ; 7. Agora com a mesa rebaixada em Z30 (livre total), da re suave nos pininhos (Y226.3 empurra a rampa mecanica e eleva a escova)
  G1 Y226.3 F3000
  M400

  ; 8. Escovacao profunda: 18 ciclos completos (36 passadas ampliadas de 8mm a 60 mm/s)
  {% for wipe in range(18) %}
    G1 X164.0 F3600
    G1 X172.0 F3600
  {% endfor %}
  M400

  ; 9. SAIDA PELA DIREITA: Passa varrendo ate o canto direito (X180) para tosar e desgarrar qualquer fiapo da meia de silicone
  G1 X180.0 F4800
  M400

  ; 10. Desengata para a frente para a zona de seguranca em campo aberto (Y215)
  G1 Y215 F6000
  M400

  ; 11. Restaura a mesa para a altura Z exata da camada suavemente (F600 = 10 mm/s) antes de viajar para a torre/peca
  {% if orig_z < 30.0 %}
    G1 Z{orig_z} F600
    M400
  {% endif %}


[gcode_macro TESTE_LIMPEZA_BICO]
description: Teste visual a seco do movimento de limpeza na escovinha do CFS (com mesa rebaixada em Z60 e 36 passadas)
gcode:
  ; 1. Garante o Home dos eixos caso necessario
  IF_NEED_HOME
  G90
  
  ; 2. SEGURANCA OBRIGATORIA: Abaixa a mesa para Z=60mm para livrar a calha com folga total suavemente (F600)
  {action_respond_info("--> Abaixando a mesa para Z=60mm por seguranca suave...")}
  {% if printer.toolhead.position.z < 60 %}
    G1 Z60 F600
  {% endif %}
  M400

  ; 3. Posiciona no duto da purga (simulando fim da purga)
  {action_respond_info("--> Simulando fim da purga no duto traseiro (X148 Y226.5)...")}
  G1 X148 Y226.5 F4000
  G4 P1000 ; Pausa de 1s para inspecao visual

  ; 4. Executa a rotina oficial de limpeza calibrada
  CFS_SAFE_WIPE

  ; 5. Retorna para o centro da mesa
  G1 X110 Y110 F6000
  {action_respond_info("--> Teste de limpeza finalizado com 100% de sucesso!")}
